{% extends "base.html" %}

<!-- Show one page per tag -->
{% block content %}
<section class="blog">
  <div class="content">
    <h1 class="blog-heading">{{ term.name }}</h1>

    <nav class="tag-filter" aria-label="Filter posts by tag">
      <a href="{{ get_url(path='@/blog-posts/_index.md') }}" class="tag-pill">All</a>
      {% set tags = get_taxonomy(kind="tags") %}
      {% for item in tags.items %}
        <a href="{{ item.permalink | safe }}" class="tag-pill{% if item.name == term.name %} tag-pill-current{% endif %}">
          {{ item.name }}
        </a>
      {% endfor %}
    </nav>

    <ul class="blog-posts">
    {%- for page in term.pages %}
      {% include "partials/post-card.html" %}
    {% endfor %}
    </ul>
  </div>
</section>
{% endblock content %}
