{% extends "base.html" %}

{% block content %}
<section class="tag">
  <h1>{{ term.name }}</h1>

  <ul>
    {%- for page in term.pages %}
      <li>
        <a href="{{ page.permalink | safe }}">{{ page.title }}</a>
        {% if page.description %}
          <p>{{ page.description }}</p>
        {% endif %}
      </li>
    {% endfor %}
  </ul>
</section>
{% endblock content %}
